<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="CLASS" height="791px" preserveAspectRatio="none" style="width:715px;height:791px;background:#FFFFFF;" version="1.1" viewBox="0 0 715 791" width="715px" zoomAndPan="magnify"><?plantuml 1.2026.5?><defs/><g><g class="title" data-source-line="3"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="395.377" x="156.72" y="23.5352">Why the implementation does not belong in a subclass</text></g><!--class AType--><g class="entity" data-qualified-name="AType" data-source-line="6" id="ent0001"><rect fill="#F1F1F1" height="97.4648" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="158.207" x="100.63" y="312.5283"/><ellipse cx="154.2648" cy="328.5283" fill="#ADD1B2" rx="11" ry="11" style="stroke:#181818;stroke-width:1;"/><path d="M156.7379,334.6713 Q156.1569,334.9702 155.5177,335.1196 Q154.8785,335.269 154.173,335.269 Q151.6661,335.269 150.3463,333.6171 Q149.0265,331.9653 149.0265,328.8442 Q149.0265,325.7148 150.3463,324.0629 Q151.6661,322.4111 154.173,322.4111 Q154.8785,322.4111 155.526,322.5605 Q156.1735,322.7099 156.7379,323.0088 L156.7379,325.7314 Q156.1071,325.1504 155.5135,324.8806 Q154.92,324.6108 154.2892,324.6108 Q152.9445,324.6108 152.2596,325.6775 Q151.5748,326.7441 151.5748,328.8442 Q151.5748,330.936 152.2596,332.0026 Q152.9445,333.0693 154.2892,333.0693 Q154.92,333.0693 155.5135,332.7995 Q156.1071,332.5297 156.7379,331.9487 Z " fill="#000000"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="42.4375" x="174.7648" y="333.8193">AType</text><line style="stroke:#181818;stroke-width:0.5;" x1="101.63" x2="257.837" y1="344.5283" y2="344.5283"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="131.4688" x="106.63" y="362.0634">#AnIntVariable : int</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="146.207" x="106.63" y="378.5517">#ABoolVariable : bool</text><line style="stroke:#181818;stroke-width:0.5;" x1="101.63" x2="257.837" y1="385.5048" y2="385.5048"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="137.7373" x="106.63" y="403.04">+virtual DoIt() : void</text></g><!--class ASubType--><g class="entity" data-qualified-name="ASubType" data-source-line="12" id="ent0002"><rect fill="#F1F1F1" height="113.9531" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="188.6133" x="85.43" y="469.9883"/><ellipse cx="141.7479" cy="485.9883" fill="#ADD1B2" rx="11" ry="11" style="stroke:#181818;stroke-width:1;"/><path d="M144.221,492.1313 Q143.64,492.4302 143.0008,492.5796 Q142.3616,492.729 141.6561,492.729 Q139.1492,492.729 137.8294,491.0771 Q136.5096,489.4253 136.5096,486.3042 Q136.5096,483.1748 137.8294,481.5229 Q139.1492,479.8711 141.6561,479.8711 Q142.3616,479.8711 143.0091,480.0205 Q143.6566,480.1699 144.221,480.4688 L144.221,483.1914 Q143.5902,482.6104 142.9967,482.3406 Q142.4031,482.0708 141.7723,482.0708 Q140.4276,482.0708 139.7427,483.1375 Q139.0579,484.2041 139.0579,486.3042 Q139.0579,488.396 139.7427,489.4626 Q140.4276,490.5293 141.7723,490.5293 Q142.4031,490.5293 142.9967,490.2595 Q143.5902,489.9897 144.221,489.4087 Z " fill="#000000"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="67.4775" x="162.2479" y="491.2793">ASubType</text><line style="stroke:#181818;stroke-width:0.5;" x1="86.43" x2="273.0433" y1="501.9883" y2="501.9883"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="176.6133" x="91.43" y="519.5234">-_aStringVariable : string?</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="174.5693" x="91.43" y="536.0117">+AStringVariable : string?</text><line style="stroke:#181818;stroke-width:0.5;" x1="86.43" x2="273.0433" y1="542.9648" y2="542.9648"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="150.7734" x="91.43" y="560.5">+override DoIt() : void</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="106.2852" x="91.43" y="576.9883">+WriteIt() : void</text></g><g class="entity" data-qualified-name="GMN4" data-source-line="22" id="ent0005"><path d="M293.87,333.2883 L293.87,357.2583 L258.92,361.2583 L293.87,365.2583 L293.87,389.2199 A0,0 0 0 0 293.87,389.2199 L531.598,389.2199 A0,0 0 0 0 531.598,389.2199 L531.598,343.2883 L521.598,333.2883 L293.87,333.2883 A0,0 0 0 0 293.87,333.2883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M521.598,333.2883 L521.598,343.2883 L531.598,343.2883 L521.598,333.2883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="87.3882" x="299.87" y="350.8566">The contract:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="125.2266" x="391.3715" y="350.8566">calling DoIt() prints.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="200.5732" x="299.87" y="366.1672">Every caller holding an AType is</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="145.5264" x="299.87" y="381.4777">entitled to rely on that.</text></g><g class="entity" data-qualified-name="GMN7" data-source-line="28" id="ent0008"><path d="M32.1,643.9483 L32.1,776.4327 A0,0 0 0 0 32.1,776.4327 L327.3822,776.4327 A0,0 0 0 0 327.3822,776.4327 L327.3822,653.9483 L317.3822,643.9483 L183.74,643.9483 L179.74,584.3083 L175.74,643.9483 L32.1,643.9483 A0,0 0 0 0 32.1,643.9483" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M317.3822,643.9483 L317.3822,653.9483 L327.3822,653.9483 L317.3822,643.9483" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="91.0698" x="38.1" y="661.5166">The violation.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="144.4727" x="133.2831" y="661.5166">DoIt() stores instead of</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="268.1504" x="38.1" y="676.8272">printing, so a caller holding an AType gets</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="274.2822" x="38.1" y="692.1377">silence &#8212; no exception, no log line, no way</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="209.1743" x="38.1" y="707.4483">to tell except by testing the type.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="38.1" y="722.7588">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="96.897" x="38.1" y="738.0694">A breach of the</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="191.769" x="38.1" y="753.3799">Liskov Substitution Principle</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="229.869" y="753.3799">,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="159.688" x="38.1" y="768.6905">and it compiles perfectly.</text></g><g class="entity" data-qualified-name="N1" data-source-line="39" id="ent0010"><path d="M388.65,43.4883 L388.65,252.5254 L700.817,252.5254 L700.817,53.4883 L690.817,43.4883 L388.65,43.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M690.817,43.4883 L690.817,53.4883 L700.817,53.4883 L690.817,43.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="133.8975" x="394.65" y="61.0566">This is not a Bridge.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="112.4868" x="532.6607" y="61.0566">It is the argument</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="49.6069" x="394.65" y="76.3672">for one.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="394.65" y="91.6777">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="202.5981" x="394.65" y="106.9883">Subclassing was used to change</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="28.0566" x="601.3614" y="106.9883">how</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="229.8359" x="394.65" y="122.2988">something is done, which is what an</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="286.4126" x="394.65" y="137.6094">implementation is for &#8212; and overriding to do</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="291.167" x="394.65" y="152.9199">that can break a promise the supertype made.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="394.65" y="168.2305">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="219.0513" x="394.65" y="183.541">Delegation cannot: a refinement in</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="269.2676" x="394.65" y="198.8516">Bridge.Basic.Pattern runs its own body and</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="29.9609" x="394.65" y="214.1621">then</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="232.3623" x="428.7242" y="214.1621">calls implementation.DoingIt(), so its</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="204.2041" x="394.65" y="229.4727">own contract survives whichever</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="154.8193" x="394.65" y="244.7832">implementation it holds.</text></g><g class="entity" data-qualified-name="N2" data-source-line="55" id="ent0011"><path d="M6,97.0783 L6,198.9416 A0,0 0 0 0 6,198.9416 L175.74,198.9416 L179.74,312.1283 L183.74,198.9416 L353.4727,198.9416 A0,0 0 0 0 353.4727,198.9416 L353.4727,107.0783 L343.4727,97.0783 L6,97.0783 A0,0 0 0 0 6,97.0783" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M343.4727,97.0783 L343.4727,107.0783 L353.4727,107.0783 L343.4727,97.0783" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="326.4727" x="12" y="114.6466">C# asked one more question, and it did not help.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="245.356" x="12" y="129.9572">DoIt() had to be declared virtual before</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="174.1606" x="12" y="145.2677">ASubType could override it.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="257.3276" x="12" y="160.5783">Permitting an override is not sanctioning</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="275.1265" x="12" y="175.8888">every override, and the breach below is one</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="243.3691" x="12" y="191.1994">the author of AType explicitly allowed.</text></g><!--reverse link AType to ASubType--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="extension" data-source-line="19" id="lnk3"><path codeLine="19" d="M179.74,428.0483 C179.74,446.7383 179.74,450.3083 179.74,469.7383" fill="none" id="AType-backto-ASubType" style="stroke:#181818;stroke-width:1;"/><polygon fill="none" points="179.74,410.0483,173.74,428.0483,185.74,428.0483,179.74,410.0483" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><?plantuml-src TLHTRzGm47pFhrYfBo3Q07sigg8hvQ4IgYfTHH-Ha-mbLXqxs9ixZW-97y4lv9Smw-IkfRHFaUFTyUpCsEdE-i54qrFjJ4eBaMYhKVYo3dvflp6zAJhRC74_o9PwxYkEgH0hZkcssv9qJBOV7FVinOWDdfh0YNmGgjW5tvBrP2YDLJwWA8hyfSNDTc3wNX0TqC9VUlbaeZKLO4_G8TF_yn3SW_yLbjXuHMiRPJIEBiAbl7Y9dNMmJV5pZxqSgpty4NqsIqpbsmT8AVzuby72ccFK6Vz5qwtRQ275ev-BPz50O1hhzCVHqPv5KK0CfcZRJYYific1T5gTtK0z22tHr79o-hewezeu1wmTbm70aafKVm3BRTxcI5rmZLOPF-je4qhWWFhIa0IAxBO4CwGpKXRi6tLaHwKA8g7FN7OSztJMDhZiOvdvp3oIX0XNhK_2fa4d6Z8ti3Ya5E3mSzHQ5YMNh6DVC_tvzHjKYB_MFEWnXxfoeIMCpNcnCLlKOmPXv-P2gX0rJdfSZfm0kInGjg0gigax7GORqnmVRReBQy9iw90nf_8QR6kBeEfOXwWpqCGAvEy7K4iqS5nnBMxxdrmcqTNRdK8MAapnDdIEsBGy2NKf-b-vcTYEUXlGiGeH9anCb_CDq14sW1pJv5JT6T-oWdTXer0gLkXPEgq4PXDKc4rdCIMM6pWAygXwTE-mf-Ufm3hR7EkiM028QggjDPnHpUumm113RnDdscc40gehzQQPA5-mutO2HnTcFa5Fv1MSqcCH1nJD8foRPEloseXmz1H73vqaKTZWjD1ibT8a8Sxo-wYdHqEK5m64DN8vLJP7Hp5sjmGquzgkEKs2C8PyGWd9CKnFEdayqNX_WDKTB82wr2FTz6NKW6aYvsWqDZTJnsuePsVc-z2Px5t5r31SZS3PlKaLmmKDuluLgiFecljdnehUvskElHMPhyhzvfIjP7ojNB2j5plV_LtDn4yjcwElx-n6Ep5ATXc3Zj9fzkRN1hTeSBR6wm0Z7AgvUQ3DrJ6LvVmi_GK0?></g></svg>