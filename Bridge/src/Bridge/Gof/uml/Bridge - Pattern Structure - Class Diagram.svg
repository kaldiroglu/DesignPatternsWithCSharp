593.61" y="270.5472">and maintains a reference to an</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="179.6069" x="593.61" y="285.8577">object of type IImplementor.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="190.4932" x="593.61" y="301.1683">Operation() is implemented as</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="151.8105" x="593.61" y="316.4788">imp.OperationImp() &#8212; a</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="83.1099" x="749.5338" y="316.4788">higher-level</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="198.2563" x="593.61" y="331.7894">operation built from primitives.</text></g><!--class RefinedAbstraction--><g class="entity" data-qualified-name="RefinedAbstraction" data-source-line="20" id="ent0006"><rect fill="#F1F1F1" height="80.9766" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="205.0674" x="639.09" y="419.3183"/><ellipse cx="673.8338" cy="435.3183" fill="#ADD1B2" rx="11" ry="11" style="stroke:#181818;stroke-width:1;"/><path d="M676.3069,441.4613 Q675.7258,441.7602 675.0867,441.9096 Q674.4475,442.059 673.742,442.059 Q671.2351,442.059 669.9153,440.4071 Q668.5955,438.7553 668.5955,435.6342 Q668.5955,432.5048 669.9153,430.8529 Q671.2351,429.2011 673.742,429.2011 Q674.4475,429.2011 675.095,429.3505 Q675.7424,429.4999 676.3069,429.7988 L676.3069,432.5214 Q675.676,431.9404 675.0825,431.6706 Q674.489,431.4008 673.8582,431.4008 Q672.5134,431.4008 671.8286,432.4675 Q671.1438,433.5341 671.1438,435.6342 Q671.1438,437.726 671.8286,438.7926 Q672.5134,439.8593 673.8582,439.8593 Q674.489,439.8593 675.0825,439.5895 Q675.676,439.3197 676.3069,438.7387 Z " fill="#000000"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="129.1924" x="692.2213" y="440.6093">RefinedAbstraction</text><line style="stroke:#181818;stroke-width:0.5;" x1="640.09" x2="843.1574" y1="451.3183" y2="451.3183"/><line style="stroke:#181818;stroke-width:0.5;" x1="640.09" x2="843.1574" y1="459.3183" y2="459.3183"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="129.7461" x="645.09" y="476.8534">+Operation() : void</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="193.0674" x="645.09" y="493.3417">+ExtendedOperation() : void</text></g><g class="entity" data-qualified-name="GMN7" data-source-line="25" id="ent0008"><path d="M634.13,568.3583 L634.13,624.2899 A0,0 0 0 0 634.13,624.2899 L849.1271,624.2899 A0,0 0 0 0 849.1271,624.2899 L849.1271,578.3583 L839.1271,568.3583 L745.63,568.3583 L741.63,500.4383 L737.63,568.3583 L634.13,568.3583 A0,0 0 0 0 634.13,568.3583" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M839.1271,568.3583 L839.1271,578.3583 L849.1271,578.3583 L839.1271,568.3583" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="185.0786" x="640.13" y="585.9266">Extends the interface defined</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="193.9971" x="640.13" y="601.2372">by Abstraction. Knows nothing</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="169.895" x="640.13" y="616.5477">about any implementation.</text></g><!--class IImplementor--><g class="entity" data-qualified-name="IImplementor" data-source-line="30" id="ent0010"><rect fill="#F1F1F1" height="64.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="167.6611" x="128.8" y="427.5583"/><ellipse cx="163.9344" cy="443.5583" fill="#B4A7E5" rx="11" ry="11" style="stroke:#181818;stroke-width:1;"/><path d="M160.3622,439.8234 L160.3622,437.6652 L167.7416,437.6652 L167.7416,439.8234 L165.2762,439.8234 L165.2762,447.9001 L167.7416,447.9001 L167.7416,450.0583 L160.3622,450.0583 L160.3622,447.9001 L162.8275,447.9001 L162.8275,439.8234 Z " fill="#000000"/><text fill="#000000" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="90.918" x="182.4087" y="448.8493">IImplementor</text><line style="stroke:#181818;stroke-width:0.5;" x1="129.8" x2="295.4611" y1="459.5583" y2="459.5583"/><line style="stroke:#181818;stroke-width:0.5;" x1="129.8" x2="295.4611" y1="467.5583" y2="467.5583"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="155.6611" x="134.8" y="485.0934">+OperationImp() : void</text></g><g class="entity" data-qualified-name="GMN11" data-source-line="34" id="ent0012"><path d="M331.27,416.5283 L331.27,455.8083 L296.8,459.8083 L331.27,463.8083 L331.27,503.081 A0,0 0 0 0 331.27,503.081 L603.9927,503.081 A0,0 0 0 0 603.9927,503.081 L603.9927,426.5283 L593.9927,416.5283 L331.27,416.5283 A0,0 0 0 0 331.27,416.5283" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M593.9927,416.5283 L593.9927,426.5283 L603.9927,426.5283 L593.9927,416.5283" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="153.1626" x="337.27" y="434.0966">Defines the interface for</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="199.0562" x="337.27" y="449.4072">implementation classes. It does</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="22.1089" x="540.4394" y="449.4072">not</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="251.7227" x="337.27" y="464.7177">have to match Abstraction's interface &#8212;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="153.3276" x="337.27" y="480.0283">typically it provides only</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="60.4106" x="494.7109" y="480.0283">primitive</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="124.96" x="337.27" y="495.3388">operations (p. 154).</text></g><!--class ConcreteImplementorA--><g class="entity" data-qualified-name="ConcreteImplementorA" data-source-line="41" id="ent0014"><rect fill="#F1F1F1" height="64.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="189.2539" x="7" y="564.0783"/><ellipse cx="22" cy="580.0783" fill="#ADD1B2" rx="11" ry="11" style="stroke:#181818;stroke-width:1;"/><path d="M24.4731,586.2213 Q23.8921,586.5202 23.2529,586.6696 Q22.6138,586.819 21.9082,586.819 Q19.4014,586.819 18.0815,585.1671 Q16.7617,583.5153 16.7617,580.3942 Q16.7617,577.2648 18.0815,575.6129 Q19.4014,573.9611 21.9082,573.9611 Q22.6138,573.9611 23.2612,574.1105 Q23.9087,574.2599 24.4731,574.5588 L24.4731,577.2814 Q23.8423,576.7004 23.2488,576.4306 Q22.6553,576.1608 22.0244,576.1608 Q20.6797,576.1608 19.9949,577.2275 Q19.3101,578.2941 19.3101,580.3942 Q19.3101,582.486 19.9949,583.5526 Q20.6797,584.6193 22.0244,584.6193 Q22.6553,584.6193 23.2488,584.3495 Q23.8423,584.0797 24.4731,583.4987 Z " fill="#000000"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="157.2539" x="36" y="585.3693">ConcreteImplementorA</text><line style="stroke:#181818;stroke-width:0.5;" x1="8" x2="195.2539" y1="596.0783" y2="596.0783"/><line style="stroke:#181818;stroke-width:0.5;" x1="8" x2="195.2539" y1="604.0783" y2="604.0783"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="155.6611" x="13" y="621.6134">+OperationImp() : void</text></g><!--class ConcreteImplementorB--><g class="entity" data-qualified-name="ConcreteImplementorB" data-source-line="44" id="ent0015"><rect fill="#F1F1F1" height="64.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="187.6475" x="230.8" y="564.0783"/><ellipse cx="245.8" cy="580.0783" fill="#ADD1B2" rx="11" ry="11" style="stroke:#181818;stroke-width:1;"/><path d="M248.2731,586.2213 Q247.6921,586.5202 247.0529,586.6696 Q246.4138,586.819 245.7082,586.819 Q243.2014,586.819 241.8815,585.1671 Q240.5617,583.5153 240.5617,580.3942 Q240.5617,577.2648 241.8815,575.6129 Q243.2014,573.9611 245.7082,573.9611 Q246.4138,573.9611 247.0612,574.1105 Q247.7087,574.2599 248.2731,574.5588 L248.2731,577.2814 Q247.6423,576.7004 247.0488,576.4306 Q246.4553,576.1608 245.8244,576.1608 Q244.4797,576.1608 243.7949,577.2275 Q243.1101,578.2941 243.1101,580.3942 Q243.1101,582.486 243.7949,583.5526 Q244.4797,584.6193 245.8244,584.6193 Q246.4553,584.6193 247.0488,584.3495 Q247.6423,584.0797 248.2731,583.4987 Z " fill="#000000"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="155.6475" x="259.8" y="585.3693">ConcreteImplementorB</text><line style="stroke:#181818;stroke-width:0.5;" x1="231.8" x2="417.4475" y1="596.0783" y2="596.0783"/><line style="stroke:#181818;stroke-width:0.5;" x1="231.8" x2="417.4475" y1="604.0783" y2="604.0783"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="155.6611" x="236.8" y="621.6134">+OperationImp() : void</text></g><g class="entity" data-qualified-name="N1" data-source-line="55" id="ent0021"><path d="M429.81,43.4883 L429.81,160.6621 A0,0 0 0 0 429.81,160.6621 L553.61,160.6621 L502.12,247.7383 L561.61,160.6621 L759.4394,160.6621 A0,0 0 0 0 759.4394,160.6621 L759.4394,53.4883 L749.4394,43.4883 L429.81,43.4883 A0,0 0 0 0 429.81,43.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M749.4394,43.4883 L749.4394,53.4883 L759.4394,53.4883 L749.4394,43.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="171.939" x="435.81" y="61.0566">Two hierarchies, one link.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="266.9697" x="435.81" y="76.3672">Left: what the thing is, and what it can do.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="223.8247" x="435.81" y="91.6777">Right: how it is actually carried out.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="276.2437" x="435.81" y="106.9883">Neither inherits from the other, so each can</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="308.6294" x="435.81" y="122.2988">grow without the other being touched &#8212; and the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="48.9722" x="435.81" y="137.6094">link is a</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="63.1338" x="488.8954" y="137.6094">reference</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="135.7891" x="552.0292" y="137.6094">, so it is chosen while</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="114.8228" x="435.81" y="152.9199">the program runs.</text></g><!--link Client to Abstraction--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="48" id="lnk16"><path codeLine="48" d="M373.57,126.4483 C393.11,156.9983 424.9163,206.7359 448.5763,243.7359" fill="none" id="Client-to-Abstraction" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="#181818" points="451.27,247.9483,449.7913,238.2111,448.5763,243.7359,443.0515,242.5209,451.27,247.9483" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="28.5645" x="425.69" y="204.2366">uses</text></g><!--link Abstraction to IImplementor--><g class="link" data-entity-1="ent0002" data-entity-2="ent0010" data-link-type="aggregation" data-source-line="49" id="lnk17"><path codeLine="49" d="M404.2967,335.9531 C357.7967,365.7531 309.4093,396.7698 266.3093,424.3998" fill="none" id="Abstraction-IImplementor" style="stroke:#181818;stroke-width:1;"/><polygon fill="none" points="414.4,329.4783,407.1901,329.3479,404.2967,335.9531,411.5066,336.0835,414.4,329.4783" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><polygon fill="#181818" points="262.1,427.0983,271.8355,425.6085,266.3093,424.3998,267.518,418.8736,262.1,427.0983" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="77.4033" x="345.63" y="383.0966">delegates to</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="24.0767" x="245.4843" y="416.782">imp</text></g><!--reverse link Abstraction to RefinedAbstraction--><g class="link" data-entity-1="ent0002" data-entity-2="ent0006" data-link-type="extension" data-source-line="50" id="lnk18"><path codeLine="50" d="M554.2612,339.165 C596.5012,366.135 636.88,391.9183 679.12,418.8883" fill="none" id="Abstraction-backto-RefinedAbstraction" style="stroke:#181818;stroke-width:1;"/><polygon fill="none" points="539.09,329.4783,551.0323,344.2221,557.4902,334.108,539.09,329.4783" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--reverse link IImplementor to ConcreteImplementorA--><g class="link" data-entity-1="ent0010" data-entity-2="ent0014" data-link-type="extension" data-source-line