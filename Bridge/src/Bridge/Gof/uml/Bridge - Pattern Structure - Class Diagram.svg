<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="CLASS" height="643px" preserveAspectRatio="none" style="width:864px;height:643px;background:#FFFFFF;" version="1.1" viewBox="0 0 864 643" width="864px" zoomAndPan="magnify"><?plantuml 1.2026.5?><defs/><g><g class="title" data-source-line="2"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="375.7236" x="240.7017" y="23.5352">Bridge &#8212; pattern structure (Design Patterns, p. 153)</text></g><!--class Client--><g class="entity" data-qualified-name="Client" data-source-line="5" id="ent0001"><rect fill="#F1F1F1" height="48" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="71.5049" x="322.87" y="78.0783"/><ellipse cx="337.87" cy="94.0783" fill="#ADD1B2" rx="11" ry="11" style="stroke:#181818;stroke-width:1;"/><path d="M340.3431,100.2213 Q339.7621,100.5202 339.1229,100.6696 Q338.4838,100.819 337.7782,100.819 Q335.2714,100.819 333.9515,99.1671 Q332.6317,97.5153 332.6317,94.3942 Q332.6317,91.2648 333.9515,89.6129 Q335.2714,87.9611 337.7782,87.9611 Q338.4838,87.9611 339.1312,88.1105 Q339.7787,88.2599 340.3431,88.5588 L340.3431,91.2814 Q339.7123,90.7004 339.1188,90.4306 Q338.5253,90.1608 337.8944,90.1608 Q336.5497,90.1608 335.8649,91.2275 Q335.1801,92.2941 335.1801,94.3942 Q335.1801,96.486 335.8649,97.5526 Q336.5497,98.6193 337.8944,98.6193 Q338.5253,98.6193 339.1188,98.3495 Q339.7123,98.0797 340.3431,97.4987 Z " fill="#000000"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="39.5049" x="351.87" y="99.3693">Client</text><line style="stroke:#181818;stroke-width:0.5;" x1="323.87" x2="393.3749" y1="110.0783" y2="110.0783"/><line style="stroke:#181818;stroke-width:0.5;" x1="323.87" x2="393.3749" y1="118.0783" y2="118.0783"/></g><!--class Abstraction--><g class="entity" data-qualified-name="Abstraction" data-source-line="7" 