<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="CLASS" height="262px" preserveAspectRatio="none" style="width:1189px;height:262px;background:#FFFFFF;" version="1.1" viewBox="0 0 1189 262" width="1189px" zoomAndPan="magnify"><?plantuml 1.2026.5?><defs/><g><g class="title" data-source-line="2"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="445.334" x="368.5433" y="23.5352">The objects at run time &#8212; the two axes meet in one reference</text></g><g class="entity" data-qualified-name="u" data-source-line="5" id="ent0001"><rect fill="#F1F1F1" height="36.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="196.9365" x="7" y="68.5183"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="182.9365" x="14" y="84.0534">urgent : UrgentNotification</text><line style="stroke:#181818;stroke-width:0.5;" x1="8" x2="202.9365" y1="89.0066" y2="89.0066"/></g><g class="entity" data-qualified-name="dg" data-source-line="6" id="ent0002"><rect fill="#F1F1F1" height="36.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="191.3789" x="238.78" y="68.5183"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="177.3789" x="245.78" y="84.0534">digest : DigestNotification</text><line style="stroke:#181818;stroke-width:0.5;" x1="239.78" x2="429.1589" y1="89.0066" y2="89.0066"/></g><g class="entity" data-qualified-name="s" data-source-line="7" id="ent0003"><rect fill="#F1F1F1" height="36.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="196.4102" x="465.26" y="68.5183"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="182.4102" x="472.26" y="84.0534">simple : SimpleNotification</text><line style="stroke:#181818;stroke-width:0.5;" x1="466.26" x2="660.6702" y