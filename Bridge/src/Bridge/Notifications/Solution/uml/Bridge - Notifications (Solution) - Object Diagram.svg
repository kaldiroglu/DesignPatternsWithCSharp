,0 0 0 0 642.11,247.6594 L822.8361,247.6594 A0,0 0 0 0 822.8361,247.6594 L822.8361,217.0383 L812.8361,207.0383 L642.11,207.0383 A0,0 0 0 0 642.11,207.0383" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M812.8361,207.0383 L812.8361,217.0383 L822.8361,217.0383 L812.8361,207.0383" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="159.7261" x="648.11" y="224.6066">MaxBodyLength = 10000</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="146.25" x="648.11" y="239.9172">SupportsSubject = true</text></g><g class="entity" data-qualified-name="N1" data-source-line="27" id="ent0015"><path d="M696.51,43.4883 L696.51,130.041 L1174.4206,130.041 L1174.4206,53.4883 L1164.4206,43.4883 L696.51,43.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1164.4206,43.4883 L1164.4206,53.4883 L1174.4206,53.4883 L1164.4206,43.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="241.084" x="702.51" y="61.0566">Three notifications, two channels, and</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="160.3545" x="947.7073" y="61.0566">one shared email object</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="319.2808" x="702.51" y="76.3672">serving two of them (GoF implementation issue 3).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="702.51" y="91.6777">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="456.9106" x="702.51" y="106.9883">`urgent.SetChannel(email)` moves the top one across at any moment &#8212;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="372.8169" x="702.51" y="122.2988">the notification it is does not change, only how it goes out.</text></g><!--link u to sms--><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" data-link-type="dependency" data-source-line="12" id="lnk6"><path codeLine="12" d="M105.47,105.3083 C105.47,131.9683 105.47,177.3683 105.47,203.9383" fill="none" id="u-to-sms" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="105.47,208.9383,109.47,199.9383,105.47,203.9383,101.47,199.9383,105.47,208.9383" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="55.542" x="106.47" y="173.6066">_channel</text></g><!--link dg to email--><g class="link" data-entity-1="ent0002" data-entity-2="ent0005" data-link-type="dependency" data-source-line="13" id="lnk7"><path codeLine="13" d="M359.17,105.3083 C396.57,131.8983 463.1144,179.1918 500.5844,205.8218" fill="none" id="dg-to-email" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="504.66,208.7183,499.6412,200.2441,500.5844,205.8218,495.0068,206.765,504.66,208.7183" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="55.542" x="456.17" y="173.6066">_channel</text></g><!--link s to email--><g class="link" data-entity-1="ent0003" data-entity-2="ent0005" data-link-type="dependency" data-source-line="14" id="lnk8"><path codeLine="14" d="M559.16,105.3083 C552.62,131.9683 541.4516,177.5123 534.9316,204.0823" fill="none" id="s-to-email" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="533.74,208.9383,539.7696,201.1509,534.9316,204.0823,532.0001,199.2443,533.74,208.9383" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="