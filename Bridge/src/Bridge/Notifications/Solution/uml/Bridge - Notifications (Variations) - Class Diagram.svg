th:1;"/><path d="M733.511,125.3613 Q732.9299,125.6602 732.2908,125.8096 Q731.6516,125.959 730.946,125.959 Q728.4392,125.959 727.1194,124.3071 Q725.7996,122.6553 725.7996,119.5342 Q725.7996,116.4048 727.1194,114.7529 Q728.4392,113.1011 730.946,113.1011 Q731.6516,113.1011 732.2991,113.2505 Q732.9465,113.3999 733.511,113.6987 L733.511,116.4214 Q732.8801,115.8404 732.2866,115.5706 Q731.6931,115.3008 731.0622,115.3008 Q729.7175,115.3008 729.0327,116.3675 Q728.3479,117.4341 728.3479,119.5342 Q728.3479,121.626 729.0327,122.6926 Q729.7175,123.7593 731.0622,123.7593 Q731.6931,123.7593 732.2866,123.4895 Q732.8801,123.2197 733.511,122.6387 Z " fill="#000000"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="126.2256" x="751.5378" y="124.5093">NotificationService</text><line style="stroke:#181818;stroke-width:0.5;" x1="651.76" x2="945.0413" y1="135.2183" y2="135.2183"/><line style="stroke:#181818;stroke-width:0.5;" x1="651.76" x2="945.0413" y1="143.2183" y2="143.2183"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="283.2813" x="656.76" y="160.7534">+Send(kind, to, message) : DeliveryResult</text></g><g class="entity" data-qualified-name="variation 1 - a factory chooses .GoF implementation issue 2..GMN7" data-source-line="21" id="ent0008"><path d="M815.58,252.4383 L815.58,384.9227 A0,0 0 0 0 815.58,384.9227 L1143.2099,384.9227 A0,0 0 0 0 1143.2099,384.9227 L1143.2099,262.4383 L1133.2099,252.4383 L917.76,252.4383 L829.93,168.0283 L909.76,252.4383 L815.58,252.4383 A0,0 0 0 0 815.58,252.4383" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1133.2099,252.4383 L1133.2099,262.4383 L1143.2099,262.4383 L1133.2099,252.4383" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="106.9263" x="821.58" y="270.0066">The caller names</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="47.7153" x="932.6196" y="270.0066">neither</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="95.2974" x="984.4482" y="270.0066">a channel class</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="250.9482" x="821.58" y="285.3172">nor a combination class. The recipient's</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="245.6987" x="821.58" y="300.6277">stored preference decides, at run time.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="821.58" y="315.9383">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="29.6055" x="821.58" y="331.2488">kind</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="71.3857" x="855.2988" y="331.2488">arrives as a</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="291.6875" x="821.58" y="346.5594">Func&amp;lt;INotificationChannel, Notification&amp;gt;.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="288.7739" x="821.58" y="361.8699">There is no constructor method group, so the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="306.6299" x="821.58" y="377.1805">call site reads c =&amp;gt; new UrgentNotification(c).</text></g><!--class PooledChannel--><g class="entity" data-qualified-name="variation 2 - sharing one implementor .issue 3..PooledChannel" data-source-line="33" id="ent0011"><rect fill="#F1F1F1" height="113.9531" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="236.6016" x="1245.1" y="78.4883"/><ellipse cx="1308.6879" cy="94.4883" fill="#ADD1B2" rx="11" ry="11" style="stroke:#181818;stroke-width:1;"/><path d="M1311.161,100.6313 Q1310.58,100.9302 1309.9408,101.0796 Q1309.3017,101.229 1308.5961,101.229 Q1306.0893,101.229 1304.7694,99.5771 Q1303.4496,97.9253 1303.4496,94.8042 Q1303.4496,91.6748 1304.7694,90.0229 Q1306.0893,88.3711 1308.5961,88.3711 Q1309.3017,88.3711 1309.9491,88.5205 Q1310.5966,88.6699 1311.161,88.9688 L1311.161,91.6914 Q1310.5302,91.1104 1309.9367,90.8406 Q1309.3432,90.5708 1308.7123,90.5708 Q1307.3676,90.5708 1306.6828,91.6375 Q1305.9979,92.7041 1305.9979,94.8042 Q1305.9979,96.896 1306.6828,97.9626 Q1307.3676,99.0293 1308.7123,99.0293 Q1309.3432,99.0293 1309.9367,98.7595 Q1310.5302,98.4897 1311.161,97.9087 Z " fill="#000000"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="100.9258" x="1329.1879" y="99.7793">PooledChannel</text><line style="stroke:#181818;stroke-width:0.5;" x1="1246.1" x2="1480.7016" y1="110.4883" y2="110.4883"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="224.6016" x="1251.1" y="128.0234">-_delegate : INotificationChannel</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="82.8516" x="1251.1" y="144.5117">-_users : int</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="112.9023" x="1251.1" y="161">-_messages : int</text><line style="stroke:#181818;stroke-width:0.5;" x1="1246.1" x2="1480.7016" y1="167.9531" y2="167.9531"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="186.3545" x="1251.1" y="185.4883">+Acquire() : PooledChannel</text></g><g class="entity" data-qualified-name="variation 2 - sharing one implementor .issue 3..GMN12" data-source-line="40" id="ent0013"><path d="M1228.75,275.4083 L1228.75,361.961 A0,0 0 0 0 1228.75,361.961 L1498.0449,361.961 A0,0 0 0 0 1498.0449,361.961 L1498.0449,285.4083 L1488.0449,275.4083 L1367.4,275.4083 L1363.4,192.8083 L1359.4,275.4083 L1228.75,275.4083 A0,0 0 0 0 1228.75,275.4083" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1488.0449,275.4083 L1488.0449,285.4083 L1498.0449,285.4083 L1488.0449,275.4083" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="224.8467" x="1234.75" y="292.9766">One SMTP connection serving many</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="82.4624" x="1234.75" y="308.2872">notifications.</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="33.395" x="1234.75" y="323.5977">Cost:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="210.7866" x="1272.2583" y="323.5977">shared state &#8212; hence Interlocked</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="233.9238" x="1234.75" y="338.9083">on both counters, and its failures are</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="128.4067" x="1234.75" y="354.2188">everybody's at once.</text></g><g class="entity" data-qualified-name="N1" data-source-line="49" id="ent0015"><path d="M6,115.1483 L6,155.7694 L424.7949,155.7694 L424.7949,125.1483 L414.7949,115.1483 L6,115.1483" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M414.7949,115.1483 L414.7949,125.1483 L424.7949,125.1483 L414.7949,115.1483" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="397.7949" x="12" y="132.7166">Neither variation changes the pattern. Each answers a question</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="323.4258" x="12" y="148.0272">the classic version leaves to whoever writes `new`.</text></g><!--reverse link IChannelFactory to PreferenceChannelFactory--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="extension" data-source-line="17" id="lnk5"><path codeLine="17" d="M632.5702,368.6998 C640.1002,394.7398 645.88,414.7383 654.47,444.4683" fill="none" id="IChannelFactory-backto-PreferenceChannelFactory" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="none" points="627.57,351.4083,626.8064,370.3666,638.3341,367.0331,627.57,351.4083" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link NotificationService to IChannelFactory--><g class="link" data-entity-1="ent0004" data-entity-2="ent0002" data-link-type="aggregation" data-source-line="18" id="lnk6"><path codeLine="18" d="M758.5843,176.543 C725.6543,209.703 686.1337,249.491 653.2137,282.631" fill="none" id="NotificationService-IChannelFactory" style="stroke:#181818;stroke-width:1;"/><polygon fill="none" points="767.04,168.0283,759.9739,169.4671,758.5843,176.543,765.6504,175.1042,767.04,168.0283" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><polygon fill="#181818" points="649.69,286.1783,658.8706,282.6122,653.2137,282.631,653.1949,276.9742,649.69,286.1783" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><?plantuml-src dLHDRzim3BtxLn0zj2cQU6jtQxC0HRiEmR2kIBhpgiYCBSIMKb5ka6q5zYFs2_TBHihEHuEiXm7n8TBZuoFvA9ePErTULQ1BHNGPWZUJEk1GEpistn7U9i644k5-uU19UQE2SPRWpw_Vi2WSwC8vGe9G89XgNcA5DZZV1MMp270BHfkG9CbSwPdA4GxMD70AFL0mLPf3bckkpaTtio5ha8QeHZWxFe0V2O2n0Js78Gol2cKjbZSjXzm2dC3gsFdE2BMP6sOwXdCOthfWfaP7rXR48S_ynGR0dSSfUhGQzpBtu9jkpedPheqM7kMN_HRzoTYikpVBuF-KISW8SqDSSMSMsLi14lGljIzAsYOUetyotBTLdyPeivOsk2vKICGp4kfhBCqJ-kK8gIv3IxZRxlxFD7rDnBxKhjSRx18bZBKk84nS2Au2DzqN6ZNVizEqAalqO1NhXVvaOD6m0Nt_pMJ0VchxqrGVOwppSkwgYR6Dd-9T6idyQWf73PXO46OmNrS56ICo93Pr05zR2AR2D8bWJYxTQp9xpnqZKFoBbpUrrOTbkDWtskwB0W_pS96kolEyIiI