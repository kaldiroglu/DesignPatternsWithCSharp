th:1;"/><path d="M729.511,125.3613 Q728.9299,125.6602 728.2908,125.8096 Q727.6516,125.959 726.946,125.959 Q724.4392,125.959 723.1194,124.3071 Q721.7996,122.6553 721.7996,119.5342 Q721.7996,116.4048 723.1194,114.7529 Q724.4392,113.1011 726.946,113.1011 Q727.6516,113.1011 728.2991,113.2505 Q728.9465,113.3999 729.511,113.6988 L729.511,116.4214 Q728.8801,115.8404 728.2866,115.5706 Q727.6931,115.3008 727.0622,115.3008 Q725.7175,115.3008 725.0327,116.3675 Q724.3479,117.4341 724.3479,119.5342 Q724.3479,121.626 725.0327,122.6926 Q725.7175,123.7593 727.0622,123.7593 Q727.6931,123.7593 728.2866,123.4895 Q728.8801,123.2197 729.511,122.6387 Z " fill="#000000"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="126.2256" x="747.5378" y="124.5093">NotificationService</text><line style="stroke:#181818;stroke-width:0.5;" x1="647.76" x2="941.0413" y1="135.2183" y2="135.2183"/><line style="stroke:#181818;stroke-width:0.5;" x1="647.76" x2="941.0413" y1="143.2183" y2="143.2183"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="283.2813" x="652.76" y="160.7534">+Send(kind, to, message) : DeliveryResult</text></g><g class="entity" data-qualified-name="variation 1 - a factory chooses .GoF implementation issue 2..GMN7" data-source-line="21" id="ent0008"><path d="M815.05,252.4383 L815.05,400.2332 A0,0 0 0 0 815.05,400.2332 L1127.7375,400.2332 A0,0 0 0 0 1127.7375,400.2332 L1127.7375,262.4383 L1117.7375,252.4383 L906.65,252.4383 L824.02,168.0783 L898.65,252.4383 L815.05,252.4383 A0,0 0 0 0 815.05,252.4383" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1117.7375,252.4383 L1117.7375,262.4383 L1127.7375,262.4383 L1117.7375,252.4383" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="106.9263" x="821.05" y="270.0066">The caller names</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="47.7153" x="932.0896" y="270.0066">neither</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="95.2974" x="983.9182" y="270.0066">a channel class</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="250.9482" x="821.05" y="285.3172">nor a combination class. The recipient's</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="245.6987" x="821.05" y="300.6277">stored preference decides, at run time.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="821.05" y="315.9383">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="29.6055" x="821.05" y="331.2488">kind</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="71.3857" x="854.7688" y="331.2488">arrives as a</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="291.6875" x="821.05" y="346.5594">Func&amp;lt;INotificationChannel, Notification&amp;gt;.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="276.688" x="821.05" y="361.8699">Java passes UrgentNotification::new; C# has</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="286.1396" x="821.05" y="377.1805">no constructor method group, so the call site</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="254.5601" x="821.05" y="392.491">reads c =&amp;gt; new UrgentNotification(c).</text></g><!--class PooledChannel--><g class="entity" data-qualified-name="variation 2 - sharing one implementor .issue 3..PooledChannel" data-source-line="34" id="ent0011"><rect fill="#F1F1F1" height="113.9531" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="236.6016" x="1229.1" y="78.4883"/><ellipse cx="1292.6879" cy="94.4883" fill="#ADD1B2" rx="11" ry="11" style="stroke:#181818;stroke-width:1;"/><path d="M1295.161,100.6313 Q1294.58,100.9302 1293.9408,101.0796 Q1293.3017,101.229 1292.5961,101.229 Q1290.0893,101.229 1288.7694,99.5771 Q1287.4496,97.9253 1287.4496,94.8042 Q1287.4496,91.6748 1288.7694,90.0229 Q1290.0893,88.3711 1292.5961,88.3711 Q1293.3017,88.3711 1293.9491,88.5205 Q1294.5966,88.6699 1295.161,88.9688 L1295.161,91.6914 Q1294.5302,91.1104 1293.9367,90.8406 Q1293.3432,90.5708 1292.7123,90.5708 Q1291.3676,90.5708 1290.6828,91.6375 Q1289.9979,92.7041 1289.9979,94.8042 Q1289.9979,96.896 1290.6828,97.9626 Q1291.3676,99.0293 1292.7123,99.0293 Q1293.3432,99.0293 1293.9367,98.7595 Q1294.5302,98.4897 1295.161,97.9087 Z " fill="#000000"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="100.9258" x="1313.1879" y="99.7793">PooledChannel</text><line style="stroke:#181818;stroke-width:0.5;" x1="1230.1" x2="1464.7016" y1="110.4883" y2="110.4883"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="224.6016" x="1235.1" y="128.0234">-_delegate : INotificationChannel</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="82.8516" x="1235.1" y="144.5117">-_users : int</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="112.9023" x="1235.1" y="161">-_messages : int</text><line style="stroke:#181818;stroke-width:0.5;" x1="1230.1" x2="1464.7016" y1="167.9531" y2="167.9531"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="186.3545" x="1235.1" y="185.4883">+Acquire() : PooledChannel</text></g><g class="entity" data-qualified-name="variation 2 - sharing one implementor .issue 3..GMN12" data-source-line="41" id="ent0013"><path d="M1212.75,283.0583 L1212.75,369.611 A0,0 0 0 0 1212.75,369.611 L1482.0449,369.611 A0,0 0 0 0 1482.0449,369.611 L1482.0449,293.0583 L1472.0449,283.0583 L1351.4,283.0583 L1347.4,192.8783 L1343.4,283.0583 L1212.75,283.0583 A0,0 0 0 0 1212.75,283.0583" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1472.0449,283.0583 L1472.0449,293.0583 L1482.0449,293.0583 L1472.0449,283.0583" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="224.8467" x="1218.75" y="300.6266">One SMTP connection serving many</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="82.4624" x="1218.75" y="315.9372">notifications.</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="33.395" x="1218.75" y="331.2477">Cost:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="210.7866" x="1256.2583" y="331.2477">shared state &#8212; hence Interlocked</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="233.9238" x="1218.75" y="346.5583">on both counters, and its failures are</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="128.4067" x="1218.75" y="361.8688">everybody's at once.</text></g><g class="entity" data-qualified-name="N1" data-source-line="50" id="ent0015"><path d="M6,115.1483 L6,155.7694 L424.7949,155.7694 L424.7949,125.1483 L414.7949,115.1483 L6,115.1483" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M414.7949,115.1483 L414.7949,125.1483 L424.7949,125.1483 L414.7949,115.1483" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="397.7949" x="12" y="132.7166">Neither variation changes the pattern. Each answers a question</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="323.4258" x="12" y="148.0272">the classic version leaves to whoever writes `new`.</text></g><!--reverse link IChannelFactory to PreferenceChannelFactory--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="extension" data-source-line="17" id="lnk5"><path codeLine="17" d="M631.9103,376.1464 C639.6303,404.0464 646.22,427.8683 655.09,459.8883" fill="none" id="IChannelFactory-backto-PreferenceChannelFactory" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="none" points="627.11,358.7983,626.1276,377.7465,637.693,374.5463,627.11,358.7983" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link NotificationService to IChannelFactory--><g class="link" data-entity-1="ent0004" data-entity-2="ent0002" data-link-type="aggregation" data-source-line="18" id="lnk6"><path codeLine="18" d="M756.7584,176.8567 C724.2684,211.7167 683.8892,255.0607 651.3592,289.9607" fill="none" id="NotificationService-IChannelFactory" style="stroke:#181818;stroke-width:1;"/><polygon fill="none" points="764.94,168.0783,757.923,169.7403,756.7584,176.8567,763.7753,175.1947,764.94,168.0783" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><polygon fill="#181818" points="647.95,293.6183,657.0125,289.762,651.3592,289.9607,651.1605,284.3074,647.95,293.6183" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><?plantuml-src dLJRJjj047ttLuoe144aRg5l8Os4e5HfLOe8VIwRzSHUPRrhTjQ9qXQf7z4lx9TqTkrSY58UAf47rZDdPiwSCpHJfX9Eb22r8Bhmtgb9xN4ahHchxmXl4g-yHhXVM9WBfuHNrX3y-VKR5eK5MLXBIE0B15LM6aiqthek29F50BlWQEMJ9Ac4d8aSuM0D0wVG0m5J8JbbkSRgVB3N6x0cKX7L26V71_0Z0L36e-CqXD5b8On1VTrYXAy09x1wjgvpXr9LYf6EeG-Z6-lLLCc8sWPnoXF_8W5mwt2A3et4lSWz-2QRTsAqAoK3Zd3BGHlzIPcikxVAyFyw2obtc2lYYJkpYDus49B-rUspaRQ1n-ZcYdbRyJH6axMmtdQXH2BUKO2-Ggtcw9PtIBNsBU0ktOEVQVf